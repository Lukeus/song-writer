document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-weight: 500;\n  font-display: swap;\n  src: url(\"32779b55-7d6d-4e69-8612-6878d9b0c98a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"61e16539-1f41-4851-819f-60ac8648894c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1329f71a-0310-4afd-9229-0599dc2db049\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"32779b55-7d6d-4e69-8612-6878d9b0c98a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ── Lukeus color system ──────────────────────────────────────────────\n   Dark base, three signal accents. Cyan leads; peach + mint are secondary\n   signals used sparingly. One dominant accent per section — don't rainbow.\n   Accents should cover ~5% of a surface; restraint makes them read as signal. */\n:root {\n  /* Core ink + surfaces */\n  --lk-ink: #0b0f14;          /* page background */\n  --lk-surface-1: #121922;    /* cards, panels */\n  --lk-surface-2: #1a232e;    /* raised / hover */\n  --lk-line: #243140;         /* hairline borders */\n\n  /* Text */\n  --lk-text: #eef2f6;         /* primary text */\n  --lk-text-dim: #90a0b0;     /* secondary text */\n  --lk-text-faint: #5c6a78;   /* captions, metadata */\n\n  /* Signal accents */\n  --lk-cyan: #7cd2ff;         /* PRIMARY — links, focus, key CTAs, \"now playing\" */\n  --lk-peach: #ffbb7c;        /* secondary — warmth, \"listen\" surfaces */\n  --lk-mint: #a3ffb0;         /* tertiary — \"lab\"/experiment tags, success */\n  --lk-cyan-hover: #a4e0ff;   /* primary button hover */\n\n  /* Semantic aliases */\n  --lk-bg: var(--lk-ink);\n  --lk-text-body: var(--lk-text);\n  --lk-text-muted: var(--lk-text-dim);\n  --lk-border: var(--lk-line);\n  --lk-accent: var(--lk-cyan);\n  --lk-success: var(--lk-mint);\n}\n<\u002Fstyle>\n  <style>/* ── Lukeus typography tokens ─────────────────────────────────────────\n   A deliberate trio. Lowercase display lines, sentence-case body, never\n   Title Case. Mono is reserved for eyebrows, nav, tags, and metadata. */\n:root {\n  /* Families */\n  --lk-display: \"Space Grotesk\", sans-serif;  /* @kind font */ /* headlines, hero, wordmark — 500/700 */\n  --lk-body: \"Manrope\", sans-serif;           /* @kind font */ /* paragraphs, UI — 400/600 */\n  --lk-mono: \"Source Code Pro\", monospace;    /* @kind font */ /* eyebrows, nav, tags, metadata — 400/500 */\n\n  /* Scale (desktop, 1.250 major-third) */\n  --lk-text-display: 64px;   /* Display XL — hero brandline / 1.05 */\n  --lk-text-h1: 44px;        /* H1 — section titles / 1.1 */\n  --lk-text-h2: 31px;        /* H2 — sub-sections / 1.2 */\n  --lk-text-h3: 22px;        /* H3 — card titles / 1.3 */\n  --lk-text-base: 17px;      /* Body — paragraphs / 1.6 */\n  --lk-text-sm: 14px;        /* Small — secondary / 1.5 */\n  --lk-text-label: 13px;     /* Mono label — eyebrows, tags, nav / 1.4 */\n\n  /* Line heights */\n  --lk-leading-display: 1.05;\n  --lk-leading-tight: 1.1;\n  --lk-leading-snug: 1.3;\n  --lk-leading-body: 1.6;\n\n  /* Tracking */\n  --lk-tracking-display: -0.02em; /* tighten hero */\n  --lk-tracking-label: 0.08em;    /* +8% on mono labels */\n}\n<\u002Fstyle>\n  <style>/* ── Lukeus spacing, radius & motion ──────────────────────────────────\n   Spacing scale: 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128.\n   Container max-width 1120px, 24px gutters, 96px section padding. */\n:root {\n  /* Spacing scale */\n  --lk-space-1: 4px;\n  --lk-space-2: 8px;\n  --lk-space-3: 12px;\n  --lk-space-4: 16px;\n  --lk-space-5: 24px;\n  --lk-space-6: 32px;\n  --lk-space-7: 48px;\n  --lk-space-8: 64px;\n  --lk-space-9: 96px;\n  --lk-space-10: 128px;\n\n  /* Layout */\n  --lk-container: 1120px;\n  --lk-gutter: 24px;\n  --lk-section-y: 96px;\n\n  /* Radius — brackets/mono blocks stay square */\n  --lk-radius: 4px;          /* controls */\n  --lk-radius-card: 12px;    /* cards */\n  --lk-radius-pill: 999px;   /* pills */\n\n  /* Motion — subtle only, no neon glow, no bounce */\n  --lk-ease: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --lk-dur-hover: 180ms;     /* @kind other */ /* hover transitions */\n  --lk-dur-reveal: 320ms;    /* @kind other */ /* reveals */\n}\n<\u002Fstyle>\n  <style>/* ── Lukeus component styles ──────────────────────────────────────────\n   Class-based styling for the React component library. Components reference\n   these classes; all values come from the token custom properties. */\n\n/* Base — components assume a dark canvas */\n.lk-root {\n  background: var(--lk-ink);\n  color: var(--lk-text);\n  font-family: var(--lk-body);\n  font-size: var(--lk-text-base);\n  line-height: var(--lk-leading-body);\n  -webkit-font-smoothing: antialiased;\n}\n.lk-root *,\n.lk-root *::before,\n.lk-root *::after { box-sizing: border-box; }\n\n/* Eyebrow */\n.lk-eyebrow {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: var(--lk-tracking-label);\n  text-transform: uppercase;\n  color: var(--lk-cyan);\n  margin: 0;\n}\n.lk-eyebrow--peach { color: var(--lk-peach); }\n.lk-eyebrow--mint { color: var(--lk-mint); }\n\n/* Section head */\n.lk-section-head { margin-bottom: var(--lk-space-6); }\n.lk-section-head__title {\n  font-family: var(--lk-display);\n  font-weight: 700;\n  font-size: var(--lk-text-h2);\n  line-height: var(--lk-leading-tight);\n  letter-spacing: -0.01em;\n  color: var(--lk-text);\n  margin: var(--lk-space-2) 0 0;\n}\n.lk-section-head__lead {\n  color: var(--lk-text-dim);\n  max-width: 54ch;\n  margin: var(--lk-space-4) 0 0;\n}\n\n/* Button */\n.lk-btn {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  padding: 14px 22px;\n  border-radius: var(--lk-radius);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--lk-space-2);\n  cursor: pointer;\n  border: 1px solid transparent;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n  text-decoration: none;\n}\n.lk-btn--primary { background: var(--lk-cyan); color: var(--lk-ink); font-weight: 500; }\n.lk-btn--primary:hover { background: var(--lk-cyan-hover); transform: translateY(-1px); }\n.lk-btn--ghost { border-color: var(--lk-line); color: var(--lk-text); background: transparent; }\n.lk-btn--ghost:hover { border-color: var(--lk-cyan); color: var(--lk-cyan); }\n\n/* Nav */\n.lk-nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 64px;\n  padding: 0 var(--lk-gutter);\n  background: rgba(11, 15, 20, 0.78);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--lk-line);\n}\n.lk-brand {\n  font-family: var(--lk-mono);\n  font-weight: 500;\n  font-size: 18px;\n  color: var(--lk-text);\n  letter-spacing: 0.02em;\n  text-decoration: none;\n  white-space: nowrap;\n}\n.lk-brand b { color: var(--lk-cyan); font-weight: 500; }\n.lk-nav__links { display: flex; gap: 28px; }\n.lk-nav__links a {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--lk-text-dim);\n  text-decoration: none;\n  padding-bottom: 2px;\n  border-bottom: 1px solid transparent;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-nav__links a:hover { color: var(--lk-text); border-color: var(--lk-cyan); }\n\n/* Release card */\n.lk-release {\n  display: grid;\n  grid-template-columns: 260px 1fr;\n  gap: var(--lk-space-6);\n  background: var(--lk-surface-1);\n  border: 1px solid var(--lk-line);\n  border-radius: var(--lk-radius-card);\n  padding: var(--lk-space-5);\n  align-items: center;\n}\n.lk-cover {\n  aspect-ratio: 1;\n  border-radius: 8px;\n  border: 1px solid var(--lk-line);\n  background:\n    radial-gradient(120px 120px at 30% 30%, rgba(124, 210, 255, 0.5), transparent),\n    radial-gradient(160px 160px at 75% 80%, rgba(255, 187, 124, 0.45), transparent),\n    radial-gradient(140px 140px at 80% 20%, rgba(163, 255, 176, 0.4), transparent),\n    var(--lk-surface-2);\n  display: flex;\n  align-items: flex-end;\n  padding: var(--lk-space-4);\n  object-fit: cover;\n}\n.lk-cover span { font-family: var(--lk-display); font-weight: 700; font-size: 24px; color: var(--lk-ink); mix-blend-mode: overlay; }\n.lk-release__meta { font-family: var(--lk-mono); font-size: var(--lk-text-label); color: var(--lk-text-faint); letter-spacing: 0.04em; }\n.lk-release__title { font-family: var(--lk-display); font-weight: 700; font-size: 28px; color: var(--lk-text); margin: 10px 0 6px; }\n.lk-release__desc { color: var(--lk-text-dim); margin: 0 0 22px; font-size: 16px; }\n\n/* Platform chips */\n.lk-chips { display: flex; flex-wrap: wrap; gap: 10px; }\n.lk-chip {\n  font-family: var(--lk-mono);\n  font-size: 12px;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--lk-text-dim);\n  border: 1px solid var(--lk-line);\n  border-radius: var(--lk-radius-pill);\n  padding: var(--lk-space-2) 14px;\n  text-decoration: none;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-chip:hover { color: var(--lk-ink); background: var(--lk-peach); border-color: var(--lk-peach); }\n\n/* Discography row */\n.lk-rel {\n  display: grid;\n  grid-template-columns: 56px 1fr auto;\n  align-items: center;\n  gap: 14px;\n  padding: 13px 0;\n  border-bottom: 1px solid var(--lk-line);\n  text-decoration: none;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-rel:hover { padding-left: 6px; }\n.lk-rel:hover .lk-rel__name { color: var(--lk-cyan); }\n.lk-rel__year { font-family: var(--lk-mono); font-size: var(--lk-text-label); color: var(--lk-text-faint); }\n.lk-rel__name { font-family: var(--lk-display); font-weight: 500; font-size: var(--lk-text-base); color: var(--lk-text); }\n.lk-rel__type { font-family: var(--lk-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--lk-text-faint); }\n\n/* Video card */\n.lk-video {\n  background: var(--lk-surface-1);\n  border: 1px solid var(--lk-line);\n  border-radius: var(--lk-radius-card);\n  overflow: hidden;\n  display: block;\n  text-decoration: none;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-video:hover { transform: translateY(-3px); }\n.lk-video__thumb {\n  aspect-ratio: 16 / 9;\n  background: var(--lk-surface-2);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--lk-cyan);\n  font-size: 34px;\n  border-bottom: 1px solid var(--lk-line);\n  object-fit: cover;\n}\n.lk-video__body { padding: var(--lk-space-4); }\n.lk-video__title { font-family: var(--lk-body); font-weight: 600; font-size: var(--lk-text-base); color: var(--lk-text); margin: 0; }\n.lk-video__meta { font-family: var(--lk-mono); font-size: 12px; color: var(--lk-text-faint); margin-top: 6px; letter-spacing: 0.04em; }\n\n/* Social row */\n.lk-social { display: flex; flex-wrap: wrap; gap: var(--lk-space-3); }\n.lk-social a {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  color: var(--lk-text-dim);\n  border: 1px solid var(--lk-line);\n  border-radius: var(--lk-radius-pill);\n  padding: 11px 18px;\n  text-decoration: none;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-social a:hover { color: var(--lk-ink); background: var(--lk-cyan); border-color: var(--lk-cyan); }\n\n/* Lab tag */\n.lk-lab-tag {\n  display: inline-block;\n  font-family: var(--lk-mono);\n  font-size: 11px;\n  letter-spacing: var(--lk-tracking-label);\n  text-transform: uppercase;\n  color: var(--lk-ink);\n  background: var(--lk-mint);\n  border-radius: var(--lk-radius-pill);\n  padding: var(--lk-space-1) 10px;\n}\n\n/* Player */\n.lk-player { border-radius: var(--lk-radius-card); overflow: hidden; border: 1px solid var(--lk-line); }\n.lk-player iframe { display: block; border: 0; width: 100%; }\n\n/* Footer */\n.lk-footer {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: var(--lk-space-4);\n  padding: var(--lk-space-6) var(--lk-gutter);\n  border-top: 1px solid var(--lk-line);\n}\n.lk-footer__note { font-family: var(--lk-mono); font-size: 12px; color: var(--lk-text-faint); letter-spacing: 0.03em; margin: 0; }\n<\u002Fstyle>\n  <style>/* Lukeus Design System — global entry point.\n   Consumers link this one file. Keep it as @import lines only. */\n/* Lukeus typefaces — all three are Google Fonts (no local binaries needed).\n   Display: Space Grotesk · Body: Manrope · Mono/labels: Source Code Pro */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b7a6f6cd-e548-4131-9e29-621eeb82b739\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a25c9471-5e18-4ab0-8edd-70d9cd116c68\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490- 1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"32779b55-7d6d-4e69-8612-6878d9b0c98a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ── Lukeus color system ──────────────────────────────────────────────\n   Dark base, three signal accents. Cyan leads; peach + mint are secondary\n   signals used sparingly. One dominant accent per section — don't rainbow.\n   Accents should cover ~5% of a surface; restraint makes them read as signal. */\n:root {\n  /* Core ink + surfaces */\n  --lk-ink: #0b0f14;          /* page background */\n  --lk-surface-1: #121922;    /* cards, panels */\n  --lk-surface-2: #1a232e;    /* raised / hover */\n  --lk-line: #243140;         /* hairline borders */\n\n  /* Text */\n  --lk-text: #eef2f6;         /* primary text */\n  --lk-text-dim: #90a0b0;     /* secondary text */\n  --lk-text-faint: #5c6a78;   /* captions, metadata */\n\n  /* Signal accents */\n  --lk-cyan: #7cd2ff;         /* PRIMARY — links, focus, key CTAs, \"now playing\" */\n  --lk-peach: #ffbb7c;        /* secondary — warmth, \"listen\" surfaces */\n  --lk-mint: #a3ffb0;         /* tertiary — \"lab\"/experiment tags, success */\n  --lk-cyan-hover: #a4e0ff;   /* primary button hover */\n\n  /* Semantic aliases */\n  --lk-bg: var(--lk-ink);\n  --lk-text-body: var(--lk-text);\n  --lk-text-muted: var(--lk-text-dim);\n  --lk-border: var(--lk-line);\n  --lk-accent: var(--lk-cyan);\n  --lk-success: var(--lk-mint);\n}\n\n/* ── Lukeus typography tokens ─────────────────────────────────────────\n   A deliberate trio. Lowercase display lines, sentence-case body, never\n   Title Case. Mono is reserved for eyebrows, nav, tags, and metadata. */\n:root {\n  /* Families */\n  --lk-display: \"Space Grotesk\", sans-serif;  /* @kind font */ /* headlines, hero, wordmark — 500/700 */\n  --lk-body: \"Manrope\", sans-serif;           /* @kind font */ /* paragraphs, UI — 400/600 */\n  --lk-mono: \"Source Code Pro\", monospace;    /* @kind font */ /* eyebrows, nav, tags, metadata — 400/500 */\n\n  /* Scale (desktop, 1.250 major-third) */\n  --lk-text-display: 64px;   /* Display XL — hero brandline / 1.05 */\n  --lk-text-h1: 44px;        /* H1 — section titles / 1.1 */\n  --lk-text-h2: 31px;        /* H2 — sub-sections / 1.2 */\n  --lk-text-h3: 22px;        /* H3 — card titles / 1.3 */\n  --lk-text-base: 17px;      /* Body — paragraphs / 1.6 */\n  --lk-text-sm: 14px;        /* Small — secondary / 1.5 */\n  --lk-text-label: 13px;     /* Mono label — eyebrows, tags, nav / 1.4 */\n\n  /* Line heights */\n  --lk-leading-display: 1.05;\n  --lk-leading-tight: 1.1;\n  --lk-leading-snug: 1.3;\n  --lk-leading-body: 1.6;\n\n  /* Tracking */\n  --lk-tracking-display: -0.02em; /* tighten hero */\n  --lk-tracking-label: 0.08em;    /* +8% on mono labels */\n}\n\n/* ── Lukeus spacing, radius & motion ──────────────────────────────────\n   Spacing scale: 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128.\n   Container max-width 1120px, 24px gutters, 96px section padding. */\n:root {\n  /* Spacing scale */\n  --lk-space-1: 4px;\n  --lk-space-2: 8px;\n  --lk-space-3: 12px;\n  --lk-space-4: 16px;\n  --lk-space-5: 24px;\n  --lk-space-6: 32px;\n  --lk-space-7: 48px;\n  --lk-space-8: 64px;\n  --lk-space-9: 96px;\n  --lk-space-10: 128px;\n\n  /* Layout */\n  --lk-container: 1120px;\n  --lk-gutter: 24px;\n  --lk-section-y: 96px;\n\n  /* Radius — brackets/mono blocks stay square */\n  --lk-radius: 4px;          /* controls */\n  --lk-radius-card: 12px;    /* cards */\n  --lk-radius-pill: 999px;   /* pills */\n\n  /* Motion — subtle only, no neon glow, no bounce */\n  --lk-ease: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --lk-dur-hover: 180ms;     /* @kind other */ /* hover transitions */\n  --lk-dur-reveal: 320ms;    /* @kind other */ /* reveals */\n}\n\n/* ── Lukeus component styles ──────────────────────────────────────────\n   Class-based styling for the React component library. Components reference\n   these classes; all values come from the token custom properties. */\n\n/* Base — components assume a dark canvas */\n.lk-root {\n  background: var(--lk-ink);\n  color: var(--lk-text);\n  font-family: var(--lk-body);\n  font-size: var(--lk-text-base);\n  line-height: var(--lk-leading-body);\n  -webkit-font-smoothing: antialiased;\n}\n.lk-root *,\n.lk-root *::before,\n.lk-root *::after { box-sizing: border-box; }\n\n/* Eyebrow */\n.lk-eyebrow {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: var(--lk-tracking-label);\n  text-transform: uppercase;\n  color: var(--lk-cyan);\n  margin: 0;\n}\n.lk-eyebrow--peach { color: var(--lk-peach); }\n.lk-eyebrow--mint { color: var(--lk-mint); }\n\n/* Section head */\n.lk-section-head { margin-bottom: var(--lk-space-6); }\n.lk-section-head__title {\n  font-family: var(--lk-display);\n  font-weight: 700;\n  font-size: var(--lk-text-h2);\n  line-height: var(--lk-leading-tight);\n  letter-spacing: -0.01em;\n  color: var(--lk-text);\n  margin: var(--lk-space-2) 0 0;\n}\n.lk-section-head__lead {\n  color: var(--lk-text-dim);\n  max-width: 54ch;\n  margin: var(--lk-space-4) 0 0;\n}\n\n/* Button */\n.lk-btn {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  padding: 14px 22px;\n  border-radius: var(--lk-radius);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--lk-space-2);\n  cursor: pointer;\n  border: 1px solid transparent;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n  text-decoration: none;\n}\n.lk-btn--primary { background: var(--lk-cyan); color: var(--lk-ink); font-weight: 500; }\n.lk-btn--primary:hover { background: var(--lk-cyan-hover); transform: translateY(-1px); }\n.lk-btn--ghost { border-color: var(--lk-line); color: var(--lk-text); background: transparent; }\n.lk-btn--ghost:hover { border-color: var(--lk-cyan); color: var(--lk-cyan); }\n\n/* Nav */\n.lk-nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 64px;\n  padding: 0 var(--lk-gutter);\n  background: rgba(11, 15, 20, 0.78);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--lk-line);\n}\n.lk-brand {\n  font-family: var(--lk-mono);\n  font-weight: 500;\n  font-size: 18px;\n  color: var(--lk-text);\n  letter-spacing: 0.02em;\n  text-decoration: none;\n  white-space: nowrap;\n}\n.lk-brand b { color: var(--lk-cyan); font-weight: 500; }\n.lk-nav__links { display: flex; gap: 28px; }\n.lk-nav__links a {\n  font-family: var(--lk-mono);\n  font-size: var(--lk-text-label);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--lk-text-dim);\n  text-decoration: none;\n  padding-bottom: 2px;\n  border-bottom: 1px solid transparent;\n  transition: var(--lk-dur-hover) var(--lk-ease);\n}\n.lk-nav__links a:hover { color: var(--lk-text); border-color: var(--lk-cyan); }\n\n/* Release card */\n.lk-release {\n  display: grid;\n  grid-template-columns: 260px 1fr;\n  gap: var(--lk-space-6);\n  background: var(--lk-surface-1);\n  border: 1px solid var(--lk-line);\n  border-radius: var(--lk-radius-card);\n  padding: var(--lk-space-5);\n  align-items: center;\n}\n.lk-cover {\n  aspect-ratio: 1;\n  border-radius: 8px;\n  border: 1px solid var(--lk-line);\n  background:\n    radial-gradient(120px 120px at 30% 30%, rgba(124, 210, 255, 0.5), transparent),\n    radial-gradient(160px 160px at 75% 80%, rgba(255, 187, 124, 0.45), transparent),\n    radial-gradient(140px 140px at 80% 20%, rgba(163, 255, 176, 0.4), transparent),\n    var(--lk-surface-2);\n  display: flex;\n  align-items: flex-end;\n  padding: var(--lk-space-4);\n  object-fit: cover;\n}\n.lk-cover span { etter-spacing:.04em\">RESCAN<\u002Fspan><\u002Fdiv>\n              <div style=\"font:400 12px/1.7 'Manrope',sans-serif;color:#90a0b0\">18 projects found · 5 linked<br><span style=\"color:#5c6a78\">last scan · today 09:12<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px dashed #243140;border-radius:12px;padding:14px;text-align:center;font:400 12px 'Manrope',sans-serif;color:#5c6a78\">SETLISTS · coming soon<br><span style=\"font:400 10.5px 'Source Code Pro',monospace;letter-spacing:.05em\">group songs for a show or a release<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;instrument&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;guitar&quot;,&quot;piano&quot;],&quot;default&quot;:&quot;guitar&quot;,&quot;tsType&quot;:&quot;\\&quot;guitar\\&quot; | \\&quot;piano\\&quot;&quot;}}\">\nconst SHAPES = {\n  Am: { roman: \"i\",   frets: [-1, 0, 2, 2, 1, 0],  notes: [9, 0, 4],  fingering: \"x02210\" },\n  Dm: { roman: \"iv\",  frets: [-1, -1, 0, 2, 3, 1], notes: [2, 5, 9],  fingering: \"xx0231\" },\n  Em: { roman: \"v\",   frets: [0, 2, 2, 0, 0, 0],   notes: [4, 7, 11], fingering: \"022000\" },\n  F:  { roman: \"VI\",  frets: [-1, -1, 3, 2, 1, 1], notes: [5, 9, 0],  fingering: \"xx3211\" },\n  C:  { roman: \"III\", frets: [-1, 3, 2, 0, 1, 0],  notes: [0, 4, 7],  fingering: \"x32010\" },\n  G:  { roman: \"VII\", frets: [3, 2, 0, 0, 0, 3],   notes: [7, 11, 2], fingering: \"320003\" }\n};\n\nconst ORDER = [\"Am\", \"Dm\", \"Em\", \"F\", \"C\", \"G\"];\nconst WHITE = [0, 2, 4, 5, 7, 9, 11];\nconst NAMES = [\"C\", \"C#\", \"D\", \"D#\", \"E\", \"F\", \"F#\", \"G\", \"G#\", \"A\", \"A#\", \"B\"];\nconst FRET_ROWS = 4;\n\nclass Component extends DCLogic {\n  state = { instrument: null };\n\n  renderVals() {\n    const inst = this.state.instrument ?? this.props.instrument ?? \"guitar\";\n    const isGuitar = inst === \"guitar\";\n\n    const chords = ORDER.map(name => {\n      const s = SHAPES[name];\n      const markers = s.frets.map(f => ({ glyph: f === 0 ? \"o\" : f < 0 ? \"x\" : \"\\u00A0\" }));\n\n      const cells = [];\n      for (let fret = 1; fret <= FRET_ROWS; fret++) {\n        for (let str = 0; str < 6; str++) cells.push({ dot: s.frets[str] === fret });\n      }\n\n      // 7 white slots; each may carry an overlapping black key on its right edge\n      const keys = WHITE.map(pc => ({\n        active: s.notes.includes(pc),\n        hasBlack: !WHITE.includes((pc + 1) % 12),\n        blackActive: s.notes.includes((pc + 1) % 12)\n      }));\n\n      return {\n        name, roman: s.roman, fingering: s.fingering, cells, markers, keys,\n        notes: s.notes.map(n => NAMES[n]).join(\" \")\n      };\n    });\n\n    return {\n      chords, isGuitar, isPiano: !isGuitar,\n      showGuitar: () => this.setState({ instrument: \"guitar\" }),\n      showPiano: () => this.setState({ instrument: \"piano\" })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
